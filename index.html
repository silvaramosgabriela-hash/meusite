<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Anime - Quiz</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #ff3366;
            --text: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); padding: 2rem; text-align: center; }

        header { margin-bottom: 2rem; }
        header h1 { color: var(--primary); font-size: 2.5rem; }

        .hidden { display: none !important; }

        /* Catálogo de Animes */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            max-width: 1000px;
            margin: 0 auto;
        }

        .anime-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 1rem;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            border: 2px solid transparent;
        }

        .anime-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .anime-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 8px;
        }

        .anime-card h3 { margin-top: 0.8rem; }

        /* Quiz */
        .quiz-container {
            background-color: var(--card-bg);
            max-width: 500px;
            margin: 0 auto;
            padding: 2rem;
            border-radius: 12px;
            border: 2px solid var(--primary);
        }

        .options-grid { display: grid; gap: 10px; margin: 1.5rem 0; }

        button {
            background-color: #2a2a2a;
            color: white;
            border: 1px solid #444;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }

        button:hover { background-color: var(--primary); border-color: var(--primary); }
        .btn-back { background-color: #444; margin-bottom: 1rem; }
    </style>
</head>
<body>

    <header>
        <h1>Mundo Anime Quiz</h1>
        <p>Clique em um anime para iniciar o jogo de perguntas!</p>
    </header>

    <!-- TELA 1: CATÁLOGO DE ANIMES -->
    <main id="catalog-screen">
        <div class="anime-grid" id="animeGrid"></div>
    </main>

    <!-- TELA 2: QUIZ DO ANIME SELECIONADO -->
    <main id="quiz-screen" class="quiz-container hidden">
        <button class="btn-back" onclick="voltarAoCatalogo()">← Voltar aos Animes</button>
        <h2 id="anime-title-quiz" style="color: var(--primary);"></h2>
        <h3 id="question-text" style="margin-top: 1rem;"></h3>
        <div id="options-container" class="options-grid"></div>
    </main>

    <!-- TELA 3: RESULTADO FINAL -->
    <main id="result-screen" class="quiz-container hidden">
        <h2>Fim do Quiz!</h2>
        <p id="final-score" style="font-size: 1.3rem; margin: 1.5rem 0; color: var(--primary);"></p>
        <button onclick="voltarAoCatalogo()">Escolher Outro Anime</button>
    </main>

    <script>
        // Dados dos animes e perguntas específicas de cada um
        const dadosAnimes = [
            {
                id: "naruto",
                titulo: "Naruto",
                imagem: "https://m.media-amazon.com/images/M/MV5BZmQ5NGFiNWEtMmMyMC00MDdhLTg4YjktMTcyMzczNDA5OWJhXkEyXkFqcGdeQXVyNTA4NzY1MzY@._V1_.jpg",
                perguntas: [
                    { pergunta: "Qual o sonho principal de Naruto Uzumaki?", opcoes: ["Ser Hokage", "Ser Caçador", "Ser o Rei dos Piratas", "Aprender Bankai"], correta: 0 },
                    { pergunta: "Quem ensinou o Rasengan para o Naruto?", opcoes: ["Kakashi", "Jiraiya", "Iruka", "Tsunade"], correta: 1 }
                ]
            },
            {
                id: "demonslayer",
                titulo: "Demon Slayer",
                imagem: "https://m.media-amazon.com/images/M/MV5BZjZjNzI5MDctY2Y4YS00NmM4LTljMTItZWYxNjQxN2Y4MDlkXkEyXkFqcGdeQXVyNjc3OTE4NDM@._V1_.jpg",
                perguntas: [
                    { pergunta: "Qual é o nome da irmã do Tanjiro?", opcoes: ["Kanao", "Nezuko", "Shinobu", "Mitsuri"], correta: 1 },
                    { pergunta: "Qual elemento é a respiração principal de Tanjiro no início?", opcoes: ["Fogo", "Trovão", "Água", "Vento"], correta: 2 }
                ]
            },
            {
                id: "spyxfamily",
                titulo: "Spy x Family",
                imagem: "https://m.media-amazon.com/images/M/MV5BNDUyY2FhYTEtZDhjOC00ZDlkLWJiYjAtNDc0MDNlZWMzOTc5XkEyXkFqcGdeQXVyMTA1NjQyNjkw._V1_.jpg",
                perguntas: [
                    { pergunta: "Qual é o poder secreto da Anya?", opcoes: ["Ler mentes", "Ficar invisível", "Super força", "Prever o futuro"], correta: 0 },
                    { pergunta: "Qual é o codinome de Loid Forger como espião?", opcoes: ["Twilight", "Thorn Princess", "Bond", "Scruffy"], correta: 0 }
                ]
            }
        ];

        let animeSelecionado = null;
        let indicePergunta = 0;
        let pontuacao = 0;

        const catalogScreen = document.getElementById('catalog-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const animeGrid = document.getElementById('animeGrid');

        // Cria os cards interativos
        function carregarCatalogo() {
            animeGrid.innerHTML = '';
            dadosAnimes.forEach(anime => {
                const card = document.createElement('div');
                card.className = 'anime-card';
                card.onclick = () => iniciarJogo(anime); // Dispara o quiz do anime clicado
                card.innerHTML = `
                    <img src="${anime.imagem}" alt="${anime.titulo}">
                    <h3>${anime.titulo}</h3>
                    <p style="font-size: 0.85rem; color: #aaa; margin-top: 5px;">Clique para jogar!</p>
                `;
                animeGrid.appendChild(card);
            });
        }

        // Abre o quiz do anime clicado
        function iniciarJogo(anime) {
            animeSelecionado = anime;
            indicePergunta = 0;
            pontuacao = 0;

            catalogScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');

            document.getElementById('anime-title-quiz').innerText = `Quiz: ${anime.titulo}`;
            mostrarPergunta();
        }

        function mostrarPergunta() {
            const perguntaAtual = animeSelecionado.perguntas[indicePergunta];
            document.getElementById('question-text').innerText = perguntaAtual.pergunta;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            perguntaAtual.opcoes.forEach((opcao, index) => {
                const btn = document.createElement('button');
                btn.innerText = opcao;
                btn.onclick = () => responder(index);
                optionsContainer.appendChild(btn);
            });
        }

        function responder(opcaoIndex) {
            if (opcaoIndex === animeSelecionado.perguntas[indicePergunta].correta) {
                pontuacao++;
            }

            indicePergunta++;

            if (indicePergunta < animeSelecionado.perguntas.length) {
                mostrarPergunta();
            } else {
                mostrarResultado();
            }
        }

        function mostrarResultado() {
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            document.getElementById('final-score').innerText = 
                `Você acertou ${pontuacao} de ${animeSelecionado.perguntas.length} perguntas em ${animeSelecionado.titulo}!`;
        }

        function voltarAoCatalogo() {
            quizScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            catalogScreen.classList.remove('hidden');
        }

        carregarCatalogo();
    </script>
</body>
</html>
